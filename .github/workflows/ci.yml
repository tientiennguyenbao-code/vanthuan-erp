name: Kiểm thử tự động

on:
  pull_request:
  push:
    branches: [main]

jobs:
  kiem-thu:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vanthuan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vanthuan_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra kiểu dữ liệu
        run: pnpm typecheck
      - name: Kiểm thử máy chủ nghiệp vụ
        run: pnpm --filter @vanthuan/api test
      - name: Dựng giao diện web
        run: pnpm --filter @vanthuan/web build
